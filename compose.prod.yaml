name: ${COMPOSE_PROJECT_NAME:-lss}

services:
  web:
    image: ${LSS_IMAGE:-carthographie/lyrics-slide-show:latest}
    container_name: app_lss
    command: sh /app/scripts/start-web-prod.sh
    env_file:
      - .env.prod
    volumes:
      - "${SHARED_SECRETS_DIR:-/opt/stacks/_shared/secrets}:${SHARED_SECRETS_DIR:-/opt/stacks/_shared/secrets}:ro"
      - "lss_static:/app/staticfiles"
      - "lss_media:/app/media"
    networks:
      - default
      - shared_backend
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.lss.rule=Host(`${LSS_DOMAIN:-lss.carthographie.fr}`)"
      - "traefik.http.routers.lss.entrypoints=websecure"
      - "traefik.http.routers.lss.tls=true"
      - "traefik.http.routers.lss.tls.certresolver=letsencrypt"
      - "traefik.http.services.lss.loadbalancer.server.port=8000"
      - "traefik.http.routers.lss-ws.rule=Host(`${LSS_DOMAIN:-lss.carthographie.fr}`) && PathPrefix(`/ws/`)"
      - "traefik.http.routers.lss-ws.entrypoints=websecure"
      - "traefik.http.routers.lss-ws.tls=true"
      - "traefik.http.routers.lss-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lss-ws.service=lss"
      - "traefik.http.routers.lss-ws.priority=300"
    restart: unless-stopped
    depends_on:
      - remote_redis

  remote_lease_reaper:
    image: ${LSS_IMAGE:-carthographie/lyrics-slide-show:latest}
    command: sh /app/scripts/start-remote-lease-reaper.sh
    env_file:
      - .env.prod
    volumes:
      - "${SHARED_SECRETS_DIR:-/opt/stacks/_shared/secrets}:${SHARED_SECRETS_DIR:-/opt/stacks/_shared/secrets}:ro"
    restart: unless-stopped
    depends_on:
      - remote_redis
    networks:
      - default
      - shared_backend

  remote_redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    networks:
      - default

networks:
  shared_backend:
    external: true
    name: ${SHARED_DB_NETWORK:-backend}
  proxy:
    external: true
    name: ${TRAEFIK_PROXY_NETWORK:-proxy}

volumes:
  lss_static:
    external: true
    name: lss_static
  lss_media:
    external: true
    name: lss_media
