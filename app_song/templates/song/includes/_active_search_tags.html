{% load i18n %}
{% if active_search_tags %}
    <div class="song-active-search-tags" aria-label="{% trans 'Filtres actifs' %}">
        {% for tag in active_search_tags %}
            <a
                class="song-tag-badge song-tag-badge-link song-tag-badge-link--removable"
                href="{{ tag.remove_url }}"
                title="{% trans 'Retirer ce filtre' %}"
            >
                {{ tag.label }}
            </a>
        {% endfor %}
    </div>
{% endif %}
