{% load i18n %}
<section class="song-link-list">
    {% if links %}
        <ul>
            {% for link in links %}
                <li>
                    <a href="{{ link.link }}" target="_blank" rel="noopener noreferrer">{{ link.link }}</a>
                    <small>({{ link.get_type_display }})</small>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>{% trans "Aucun lien associé." %}</p>
    {% endif %}
</section>
