{% load i18n %}

<nav class="site-floating-actions" aria-label="{% trans 'Actions rapides' %}">
    <div class="site-floating-help" data-floating-help>
        <button
            type="button"
            class="site-floating-action site-floating-help-toggle"
            data-floating-help-toggle
            aria-expanded="false"
            aria-controls="site-floating-help-panel"
            title="{% trans 'Afficher le lien vers le wiki' %}"
            aria-label="{% trans 'Afficher le lien vers le wiki' %}"
        >
            ❓
        </button>
        <div
            id="site-floating-help-panel"
            class="site-floating-help-panel"
            data-floating-help-panel
            hidden
        >
            <a
                href="https://github.com/ChristianPRO1982/lyrics-slide-show/wiki"
                class="site-floating-action site-floating-help-link"
                target="_blank"
                rel="noopener noreferrer"
                title="{% trans 'Ouvrir le wiki du projet' %}"
                aria-label="{% trans 'Ouvrir le wiki du projet' %}"
            >
                WIKI
            </a>
        </div>
    </div>
    <a
        href="#site-top"
        class="site-floating-action site-floating-top-link"
        title="{% trans 'Revenir en haut de la page' %}"
