{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ language_code|default:'fr' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ animation.title }} | {% trans "Projection" %}</title>
    <link href="{{ google_fonts_stylesheet_href }}" rel="stylesheet">
    <style>@import url("{% static 'css/app_animation.css' %}");</style>
</head>
<body class="lyrics-display-body">
    <main
        class="lyrics-display-root"
        data-lyrics-display-root
        data-display-session-id="{{ display_session_id }}"
    >
        <article class="lyrics-display-slide" data-lyrics-display-slide>
            <p class="lyrics-display-waiting" data-lyrics-display-waiting>{{ display_i18n.waitingLabel }}</p>
        </article>
    </main>
    {% if display_debug_enabled %}
        <aside class="lyrics-display-debug-panel" data-lyrics-display-debug-panel aria-label="{% trans 'Debug projection' %}">
            <div class="lyrics-display-debug-toolbar">
                <span class="lyrics-display-debug-title">{% trans "Debug" %}</span>
                <button type="button" class="lyrics-display-debug-copy" data-lyrics-display-debug-copy title="{% trans 'Copier' %}" aria-label="{% trans 'Copier' %}">💽</button>
                <button type="button" class="lyrics-display-debug-toggle" data-lyrics-display-debug-toggle title="{% trans 'Réduire le debug' %}" aria-label="{% trans 'Réduire le debug' %}">🔽</button>
            </div>
            <div class="lyrics-display-debug-content" data-lyrics-display-debug-content>
                <h2>{% trans "Debug projection" %}</h2>
                <pre data-lyrics-display-debug-log>{% trans "Aucun payload reçu." %}</pre>
            </div>
        </aside>
    {% endif %}
    <script>
        window.LSS_LYRICS_DISPLAY_I18N = {
            waitingLabel: "{{ display_i18n.waitingLabel|escapejs }}",
            f11ReminderLabel: "{{ display_i18n.f11ReminderLabel|escapejs }}"
        };
    </script>
    <script src="{% static 'js/lyrics_slide_show_display.js' %}"></script>
</body>
</html>
