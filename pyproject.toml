[project]
name = "lyrics-slide-show"
version = "2.4.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "channels[daphne]>=4.3",
    "channels_redis>=4.2",
    "django>=6.0.3",
    "gunicorn>=23.0.0",
    "pillow>=11.2.1",
    "psycopg[binary]>=3.2.6",
    "qrcode>=8.2",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "coverage>=7.10.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-django>=4.11.0",
    "pytest-env>=1.1.5",
    "ruff>=0.11.0",
]

[tool.ruff]
extend-exclude = ["docs", ".pre-commit-cache"]
