name: CI/CD - Main Branch

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-cicd-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks and pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lss_ci
          POSTGRES_USER: lss_ci
          POSTGRES_PASSWORD: lss_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lss_ci -d lss_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SETTINGS_MODULE: lyrics_slide_show.settings
      DJANGO_SESSION_ENGINE: django.contrib.sessions.backends.db
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DJANGO_TIME_ZONE: Europe/Paris
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: lss_ci
      DB_USER: lss_ci
      DB_PASSWORD: lss_ci
      DB_TEST_TEMPLATE: lss_ci_template
      AUTH_MODE: mock
      AUTH_MOCK_BASE_URL: http://localhost:8001
      AUTH_MOCK_SHARED_SECRET: dev-shared-secret
      AUTH_MOCK_MAX_AGE_SECONDS: "300"
      USER_SCHEMA: users
      USER_TABLE: users

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Django system checks
        run: uv run python manage.py check

      - name: Migration drift check
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Prepare PostgreSQL test template
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          template_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_TEST_TEMPLATE'")"
          if [ "$template_exists" != "1" ]; then
            createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -O "$DB_USER" "$DB_TEST_TEMPLATE"
          fi

          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_TEST_TEMPLATE" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS lss;
          CREATE SCHEMA IF NOT EXISTS users;
          CREATE SCHEMA IF NOT EXISTS common;

          CREATE TABLE IF NOT EXISTS users.users (
            id uuid PRIMARY KEY,
            username varchar(255),
            first_name varchar(255),
            last_name varchar(255),
            email varchar(255),
            enabled boolean DEFAULT TRUE,
            email_verified boolean DEFAULT FALSE,
            synced_at time,
            last_login_at time
          );

          CREATE TABLE IF NOT EXISTS common.genres (
            genre_id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            "group" varchar(255),
            name varchar(255)
          );

          CREATE TABLE IF NOT EXISTS common.artists (
            artist_id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name varchar(255)
          );

          CREATE TABLE IF NOT EXISTS common.bands (
            band_id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name varchar(255)
          );
          SQL

      - name: Pytest
        run: uv run pytest -q app_main app_member app_group app_song app_animation

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            carthographie/lyrics-slide-show:latest
            carthographie/lyrics-slide-show:sha-${{ github.sha }}

  n8n_backup:
    name: Pre-deploy backup by n8n
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - name: Call n8n webhook and wait for completion
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_USER: ${{ secrets.N8N_USER }}
          N8N_PASS: ${{ secrets.N8N_PASS }}
        run: |
          set -euo pipefail
          payload=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" \
            '{repo:$repo, sha:$sha, ref:$ref, action:"pre-deploy-backup"}')

          code=$(curl -sS -m 1800 -w "%{http_code}" -o response.json \
            -u "${N8N_USER}:${N8N_PASS}" \
            -H "content-type: application/json" \
            -X POST "$N8N_WEBHOOK_URL" \
            -d "$payload")

          echo "HTTP_STATUS=$code"
          echo "RESPONSE_BODY=$(tr -d '\n' < response.json | head -c 500)"
          test "$code" -ge 200 -a "$code" -lt 300

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs:
      - n8n_backup
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eu
            cd /opt/stacks/apps/lss
            docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml pull
            docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml up -d
            docker image prune -f

  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs:
      - deploy
    if: github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
