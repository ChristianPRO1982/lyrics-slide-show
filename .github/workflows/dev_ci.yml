name: CI - Dev Branch

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lss_ci
          POSTGRES_USER: lss_ci
          POSTGRES_PASSWORD: lss_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lss_ci -d lss_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SETTINGS_MODULE: lyrics_slide_show.settings
      DJANGO_SESSION_ENGINE: django.contrib.sessions.backends.db
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DJANGO_TIME_ZONE: Europe/Paris
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: lss_ci
      DB_USER: lss_ci
      DB_PASSWORD: lss_ci
      DB_TEST_TEMPLATE: lss_ci_template
      AUTH_MODE: mock
      AUTH_MOCK_BASE_URL: http://localhost:8001
      AUTH_MOCK_SHARED_SECRET: dev-shared-secret
      AUTH_MOCK_MAX_AGE_SECONDS: "300"
      USER_SCHEMA: users
      USER_TABLE: users

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Django system checks
        run: uv run python manage.py check

      - name: Migration drift check
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Prepare PostgreSQL test template
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          template_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_TEST_TEMPLATE'")"
          if [ "$template_exists" != "1" ]; then
            createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -O "$DB_USER" "$DB_TEST_TEMPLATE"
          fi

          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_TEST_TEMPLATE" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS lss;
          CREATE SCHEMA IF NOT EXISTS users;
          CREATE SCHEMA IF NOT EXISTS common;

          CREATE TABLE IF NOT EXISTS users.users (
            id uuid PRIMARY KEY,
            username varchar(255),
            first_name varchar(255),
            last_name varchar(255),
            email varchar(255),
            enabled boolean DEFAULT TRUE,
            email_verified boolean DEFAULT FALSE,
            synced_at time,
            last_login_at time
          );

          CREATE TABLE IF NOT EXISTS common.genres (
            genre_id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            "group" varchar(255),
            name varchar(255)
          );

          CREATE TABLE IF NOT EXISTS common.artists (
            artist_id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name varchar(255)
          );

          CREATE TABLE IF NOT EXISTS common.bands (
            band_id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name varchar(255)
          );
          SQL

      - name: Pytest
        run: uv run pytest -q
